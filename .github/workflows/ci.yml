name: LMS CI/CD Quality Gate & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-validation:
    name: 🐍 Backend Lint, Syntax & Pytest Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend Syntax & Bytecode Compilation Check
        run: |
          python -m compileall -q app tests

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: "ci-cd-test-secret-key-do-not-use-in-prod"
          ALGORITHM: "HS256"
          DB_SERVER: "localhost"
          DB_USER: "sa"
          DB_PASSWORD: "secret_ci_password"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests -v

  frontend-validation:
    name: ⚛️ Frontend Typecheck & Production Build Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Verify Production Vite Bundle Build
        run: |
          npm run build

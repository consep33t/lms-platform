worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Kernel Zero-Copy file transfer & High-performance I/O
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Support Large File Uploads (up to 1GB)
    client_max_body_size 1024M;
    client_body_buffer_size 1M;

    # Gzip Compression for text & JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream lms_backend {
        server lms_backend:8000;
        keepalive 32;
    }

    upstream lms_frontend {
        server lms_frontend:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # High-performance zero-copy media streaming via X-Accel-Redirect
        location /protected/ {
            internal;
            alias /data/uploads/;
            sendfile on;
            tcp_nopush on;
            aio threads;
            directio 512m;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=86400, immutable";
        }

        # FastAPI Backend Endpoints
        location /api/ {
            proxy_pass http://lms_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_request_buffering off;
        }

        # Signed File Delivery
        location /files/ {
            proxy_pass http://lms_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_request_buffering off;
        }

        # SPA Frontend
        location / {
            proxy_pass http://lms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
